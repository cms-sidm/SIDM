cr_1egmOr1mu_lj_spreadMu_spreadPfMu_CosMu_ljIso: &cr_1egmOr1mu_lj_spreadMu_spreadPfMu_CosMu_ljIso
  obj_cuts:
    <<: *obj_ljsource_cuts
  postLj_obj_cuts:
    ljs:
      - "pT > 30 GeV"
      - "|eta| < 2.4"
      - "lj_iso < 0.2"
    mu_ljs:
      - "Mu >= 2"
      - "dzSpread_mu <= 50"
      - "vxySpread_mu <= 50"
      - "dzSpread_pf <= 10"
      - "vxySpread_pf <= 10"
  evt_cuts:
    - *evt_baseNoLj
    - "pass flags"
    - "= 1 muLj or 1 egmLJ"
    - "all cosAlpha(mu, mu) > -0.99"

