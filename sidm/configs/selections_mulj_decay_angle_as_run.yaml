# Channel definitions of the muon lepton-jet decay-angle study (sidm/studies/mulj_decay_angle),
# exactly as its histograms were produced. Do not edit: this file records what was run.
#
# Production: three Condor campaigns on branch mulj-decay-angle-dev, 2018 data and simulation,
#   MuljDecayAngle_Run2018_v1   2026-08-28 to 2026-08-31  (merged outputs: mulj_merged)
#   MuljPairAngle_Run2018_v1    2026-08-31 to 2026-09-01  (mulj_pair_merged)
#   LjAnglePlanes_Run2018_v1    2026-09-02 to 2026-09-05  (lj_angle_planes_merged)
# The definitions below are those of sidm/configs/selections.yaml at commit 61224901 of that
# branch; the code shipped to the LjAnglePlanes_Run2018_v1 jobs is byte-identical to it.
# Every YAML anchor and merge key is resolved and every cut list is flattened the way
# SidmProcessor.build_cuts flattens it, so each channel lists the cuts in the order they run.
# Channel names are the names stored in the `channel` axis of the study's histograms.
#
# These channels predate the cosmic-veto baseline that main's selections.yaml adopted
# afterwards: the eta-phi veto on the four lepton-jet source collections (electrons, photons,
# muons, DSA muons); ">=2 muons (pf or dsa) pT > 26 GeV" and "all cosAlpha(mu, mu) > -0.99" in
# the base event cuts; dzSpread and dxySpread cuts in the base muon-LJ cuts. Channels that share
# a name with a channel of main's selections.yaml therefore select different events on main.
# Main has since also required "DT + CSC hits > 3" of every PF muon at the LJ source (65b46a86).
# None of the channels below has the eta-phi veto or that requirement. The spread-veto regions
# (names containing "spread_cosAlpha_mu_veto") cut on the transverse vertex spread vxySpread
# where main cuts on dxySpread; the other channels have no spread cut and no cosAlpha(mu, mu) cut.
#
# Use: SidmProcessor(channels, collections,
#                    selections_cfg="configs/selections_mulj_decay_angle_as_run.yaml")
# or --selections-cfg configs/selections_mulj_decay_angle_as_run.yaml (condor/run_sidm_chunk.py,
# 9th argument of condor/run_job.sh).


# ----------------------------------------------------------------------------------------------
# Signal-like channels (simulation only; blinded on data)
# ----------------------------------------------------------------------------------------------

4mu:
  obj_cuts:
    genMus:
      - "status 1"
    genEs:
      - "status 1"
    electrons:
      - "pT > 10 GeV"
      - "|eta| < 2.4"
      - "MVANonIsoWPL"
    muons:
      - "looseID"
      - "pT > 5 GeV"
      - "|eta| < 2.4"
    photons:
      - "pT > 20 GeV"
      - "|eta| < 2.5"
      - "Custom Cutbased"
      - "pixelSeed"
      - "Photon DR Veto 0p025"
    dsaMuons:
      - "pT > 10 GeV"
      - "|eta| < 2.4"
      - "displaced ID"
      - "all"
  postLj_obj_cuts:
    ljs:
      - "pT > 30 GeV"
      - "|eta| < 2.4"
    mu_ljs:
      - "Mu >= 2"
  evt_cuts:
    - "pass triggers"
    - "PV filter"
    - ">=2 LJs"
    - ">=2 muons (pf or dsa) pT > 26 GeV"
    - "4mu"

