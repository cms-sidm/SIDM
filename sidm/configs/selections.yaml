    ljs:
      - "pT > 30 GeV"
      - "|eta| < 2.4"
    mu_ljs:
      - "Mu >= 2"
  evt_cuts:
    - *evt_baseNoLj
    - "pass flags"
    - "= 2 LJs"
    - "= 2 muLJs"
    - "all cos_alpha(dsa, dsa) > -0.9"

### Generator-truth channels: no reconstruction, trigger, or vertex requirements ###

# final-state gen leptons only; no event cuts at all
genOnly: &genOnly
  obj_cuts:
    genMus:
      - "status 1"
    genEs:
      - "status 1"

# gen-level selection plus the analysis dimuon triggers: the ratio of any
# histogram to its genOnly counterpart is the trigger efficiency vs that
# variable, and the cutflow records the per-sample trigger efficiency
genOnly_trigger: &genOnly_trigger
  obj_cuts:
    genMus:
      - "status 1"
    genEs:
      - "status 1"
  evt_cuts:
    - "pass triggers"

# born-level (status 23) gen leptons, for rest-frame/polarization comparisons
genOnly_born: &genOnly_born
  obj_cuts:
    genMus:
      - "status 23"
    genEs:
      - "status 23"

# re-application of the central-production gen filter. The v10 samples were
# produced WITH this filter, so the cutflow row is a re-pass/validation rate
# (0.84-1.00, mass-dependent) -- NOT a filter efficiency; per-point production
# efficiencies: sidm/studies/truth_kinematics_forAN/central_genFilterEfficiencies.yml.
genFilterEmulation: &genFilterEmulation
  obj_cuts: {}
  evt_cuts:
    - "pass gen filter"

# same, with the piedpiper template's isHardProcess statusFlags variant
genFilterEmulation_isHardProcess: &genFilterEmulation_isHardProcess
  obj_cuts: {}
  evt_cuts:
    - "pass gen filter isHardProcess"

