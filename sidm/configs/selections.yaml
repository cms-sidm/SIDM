    genAs:
      - "lxy >= 100 cm"
    genAs_toE:
      - "lxy >= 100 cm"
    genAs_toMu:
      - "lxy >= 100 cm"

# Selections for electrons only
# All reco electrons in the barrel
barrelE: &barrelE
  evt_cuts:
    - "Keep all evts"
  obj_cuts: &obj_barrelE
    electrons: &e_barrelE
      - "|eta| < 1.479"

# same as above, but with electron-genA dR matching
barrelE_matched: &barrelE_matched
  <<: *barrelE
  obj_cuts:
    <<: *obj_barrelE
    electrons:
      - *e_barrelE
      - "dR(e, A) < 0.5"

