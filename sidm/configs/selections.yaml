# Config to define all available selections
# Selections contain object- and event-level cuts
# Previously defined selections can be imported with '<<' or '*'
# Any nested collections created by "<<" or '*' operations will be flattened in sidm_processor.py

### Main selections ###

# Cuts to apply to objects that are clustered into lepton jets
ljsource_cuts: &ljsource_cuts
  obj_cuts: &obj_ljsource_cuts
    electrons: &electrons_ljsource_cuts
      - "pT > 10 GeV"
      - "|eta| < 2.4"
      - 'MVANonIsoWPL'
      - "eta-phi_veto"
    muons: &muons_ljsource_cuts
      - "looseID"
      - "pT > 5 GeV"
      - "|eta| < 2.4"
      - "eta-phi_veto"
    photons: &photons_ljsource_cuts
      - "pT > 20 GeV"
      - "|eta| < 2.5"
      - 'Custom Cutbased'
      - "pixelSeed"
      - 'Photon DR Veto 0p025'
      - "eta-phi_veto"
    dsaMuons: &dsaMuons_ljsource_cuts
      - "pT > 10 GeV"
      - "|eta| < 2.4"
      - "displaced ID"
      - "all" # cross-cleaning
      - "eta-phi_veto"

ljsource_cuts_barrel: &ljsource_cuts_barrel
  obj_cuts: &obj_ljsource_cuts_barrel
    electrons: &electrons_ljsource_cuts_barrel
      - "pT > 10 GeV"
      - "barrel"
      - 'MVANonIsoWPL'
    muons: &muons_ljsource_cuts_barrel
      - "looseID"
      - "pT > 5 GeV"
      - "barrel"
    photons: &photons_ljsource_cuts_barrel
      - "pT > 20 GeV"
      - "barrel"
      - 'Custom Cutbased'
      - "pixelSeed"
      - 'Photon DR Veto 0p025'
    dsaMuons: &dsaMuons_ljsource_cuts_barrel
      - "pT > 10 GeV"
      - "barrel"
      - "displaced ID"
      - "all" # cross-cleaning

ljsource_cuts_endcap: &ljsource_cuts_endcap
  obj_cuts: &obj_ljsource_cuts_endcap
    electrons: &electrons_ljsource_cuts_endcap
      - "pT > 10 GeV"
      - "endcap"
      - 'MVANonIsoWPL'
    muons: &muons_ljsource_cuts_endcap
      - "looseID"
      - "pT > 5 GeV"
      - "endcap"
    photons: &photons_ljsource_cuts_endcap
      - "pT > 20 GeV"
      - "endcap"
      - 'Custom Cutbased'
      - "pixelSeed"
      - 'Photon DR Veto 0p025'
    dsaMuons: &dsaMuons_ljsource_cuts_endcap
      - "pT > 10 GeV"
      - "endcap"
      - "displaced ID"
      - "all" # cross-cleaning

# require final-state gen e and mu
gen_level_cuts: &gen_level_cuts
  obj_cuts: &obj_gen_level_cuts
    genMus:
      - "status 1"
    genEs:
      - "status 1"

# apply trigger
trigger: &trigger
  evt_cuts:
    - "pass triggers"

# PV filter
pv_cuts: &pv_cuts
  evt_cuts: &evt_pv_cuts
    - "PV filter"

# apply trigger, gen cuts, and pv filter
baseNoLjNoLjsource: &baseNoLjNoLjsource
  obj_cuts: &obj_baseNoLjNoLjsource
    <<: *obj_gen_level_cuts
  evt_cuts: &evt_baseNoLjNoljsource
    - *trigger
    - *evt_pv_cuts
    - ">=2 muons (pf or dsa) pT > 26 GeV"

# apply trigger, gen cuts, pv filter, and lj-source cuts
baseNoLj: &baseNoLj
  obj_cuts: &obj_baseNoLj
    <<: *obj_baseNoLjNoLjsource
    <<: *obj_ljsource_cuts
  evt_cuts: &evt_baseNoLj
    - *evt_baseNoLjNoljsource

# add obj-level LJ cuts
base_ljObjCut: &base_ljObjCut
  obj_cuts:
    <<: *obj_baseNoLj
  postLj_obj_cuts: &base_postLj_obj_cuts
    ljs: &lj_base
      - "pT > 30 GeV"
      - "|eta| < 2.4"
    mu_ljs: &mu_lj_base
      - "Mu >= 2"
  evt_cuts:
    - *evt_baseNoLj

# add LJ isolation and displacement cuts
base_ljDisplacementIso: &base_ljDisplacementIso
  obj_cuts:
    <<: *obj_baseNoLj
  postLj_obj_cuts: &lj_displacementIso
    ljs:
      - *lj_base
    mu_ljs: &mu_lj_displacementIso
      - *mu_lj_base
      - "mu_lj_iso < 0.1"
      - "displaced"
    egm_ljs: &egm_lj_displacementIso
      - "egm_lj_iso < 0.2"
      - "displaced"
  evt_cuts:
    - *evt_baseNoLj

# add LJ isolation, displacement cuts and cosAlpha
base_ljDisplacementIso_cosAlpha: &base_ljDisplacementIso_cosAlpha
  obj_cuts:
    <<: *obj_baseNoLj
  postLj_obj_cuts:
    <<: *lj_displacementIso
  evt_cuts:
    - *evt_baseNoLj
    - "all cosAlpha(mu, mu) > -0.99"

# add LJ isolation, displacement cuts and cosAlpha
base_ljDisplacementIso_cosAlpha_ljSpread: &base_ljDisplacementIso_cosAlpha_ljSpread
  obj_cuts:
    <<: *obj_baseNoLj
  postLj_obj_cuts:
    <<: *lj_displacementIso
    mu_ljs:
      - *mu_lj_displacementIso
      - "dzSpread_mu <= 50"
      - "dxySpread_mu <= 50"
      - "dzSpread_pf <= 10"
      - "dxySpread_pf <= 10"
  evt_cuts:
    - *evt_baseNoLj
    - "all cosAlpha(mu, mu) > -0.99"

# add >=2 LJ requirement and >=2 high pt muons
base: &base
  obj_cuts: &obj_base
    <<: *obj_baseNoLj
  postLj_obj_cuts:
    <<: *base_postLj_obj_cuts
  evt_cuts: &evt_base
    - *evt_baseNoLj
    - ">=2 LJs"


4mu: &4mu
  <<: *base
  evt_cuts: &evt_4mu
    - *evt_base
    - "4mu"

2mu2e: &2mu2e
  <<: *base
  evt_cuts: &evt_2mu2e
    - *evt_base
    - "2mu2e"

# add LJ iso, displacement, and lj-lj dPhi
base_sr: &base_sr
  obj_cuts: &obj_sr
    <<: *obj_baseNoLj
  postLj_obj_cuts: &postlj_sr
    <<: *lj_displacementIso
  evt_cuts: &evt_sr
    - *evt_base
    - "LJ-LJ dPhi > 2"

4mu_sr: &4mu_sr
  <<: *base_sr
  evt_cuts: &evt_4mu_sr
    - *evt_sr
    - "4mu"

2mu2e_sr: &2mu2e_sr
  <<: *base_sr
  evt_cuts: &evt_2mu2e_sr
    - *evt_sr
    - "2mu2e"

base_noMuPtCut: &base_noMuPtCut
  obj_cuts: &obj_base_noMuPtCut
    <<: *obj_baseNoLj
  postLj_obj_cuts:
    <<: *base_postLj_obj_cuts
  evt_cuts: &evt_base_noMuPtCut
    - *evt_baseNoLj
    - ">=2 LJs"

4mu_noMuPtCut: &4mu_noMuPtCut
  <<: *base_noMuPtCut
  evt_cuts: &evt_4mu_noMuPtCut
    - *evt_base_noMuPtCut
    - "4mu"

2mu2e_noMuPtCut: &2mu2e_noMuPtCut
  <<: *base_noMuPtCut
  evt_cuts: &evt_2mu2e_noMuPtCut
    - *evt_base_noMuPtCut
    - "2mu2e"

# Cuts to apply to a skim
trigger_muPtCut: &trigger_muPtCut
  obj_cuts: {}
  evt_cuts: &evt_trigger_muPtCut
    - "pass triggers"
    - ">=2 muons (pf or dsa) pT > 26 GeV"

trigger_muPtCut_muID: &trigger_muPtCut_muID
  obj_cuts:
    <<: *obj_ljsource_cuts
  evt_cuts:
    - *evt_trigger_muPtCut

# Cross cleaning studies
ljsource_cuts_chargeCC: &ljsource_cuts_chargeCC
  obj_cuts: &obj_ljsource_cuts_chargeCC
      <<: *obj_ljsource_cuts
      dsaMuons:
        - "pT > 10 GeV"
        - "|eta| < 2.4"
        - "displaced ID"
        - "all + charge" # cross-cleaning with charge requirement

# require final-state gen e and mu
gen_leptons_final: &gen_leptons_final
  obj_cuts: &obj_gen_leptons_final
    genMus:
      - "status 1"
    genEs:
      - "status 1"
  evt_cuts:
    - "PV filter"

# require born gen e and mu
gen_leptons_born: &gen_leptons_born
  obj_cuts: &obj_gen_leptons_born
    genMus:
      - "status 23"
    genEs:
      - "status 23"
  evt_cuts:
    - "PV filter"

baseNoLjNoLjsource_noTrigger: &baseNoLjNoLjsource_noTrigger
  obj_cuts:
    <<: *obj_gen_level_cuts
