# Collision data in the two lepton-jet control samples of step 2 of the lepton-jet reconstruction
# efficiency study, version 3 (sidm/studies/systematics/lj_reco_efficiency.md): the histograms of
# lj_reco_control_samples_v3, i.e. Z -> mumu gamma probes with the selection of final-state
# radiation (a purer sample of photons, for the converted ones) and the J/psi -> mumu probes against
# the displacement of their fitted dimuon vertex. The data files are those of lj_reco_cr_data_v1.
#
# Approved data use (2026-11-16): reading data in the lepton-jet control samples proposed in
# lj_reco_efficiency.md, each thought through before its first look, with the group's safety
# criteria (the 4mu working-point decks) deciding which regions are read. Only the _alone versions
# are filled, whose probes have no other lepton jet of the signal selection's kinds, so no event of
# the signal region enters. The two histograms were judged in simulation (campaign lj_reco_cr_v3,
# notebook 07, section 6.5; table in .../lj_reco_cr_v3_results/safety.json), with the stricter
# sparse-bin rule and the stress test. Every region of the Z -> mumu gamma sample with the FSR
# selection is safe: the worst signal point puts 0.002 events into the whole sample. Every bin of
# the J/psi vertex L_xy below 15 cm is safe (at most 0.55 signal events in a bin, binned Z at most
# 0.40). The bin at 15 cm and above is not: 4Mu_800GeV_5p0GeV_5p0mm puts 4.1 events there against
# 9,300 background events, binned Z 1.3, a caution for shape uses. It is filled but never read:
# the data step reads the outputs only through systematics_study.lj_cr_data, which sets every bin
# the safety table does not mark readable to zero before anything else.
#
#     python condor/campaign.py lj_reco_cr_data_v2 jobs
#     python condor/campaign.py lj_reco_cr_data_v2 submit   # after packaging the code (condor/README.md, section 8)
#     python condor/campaign.py lj_reco_cr_data_v2 status   # then retry --submit / skipped --submit until done
#     python condor/campaign.py lj_reco_cr_data_v2 merge

name: lj_reco_cr_data_v2
chunk_dir: /store/user/$USER/sidm_condor/LjRecoCrDataChunks_v2
merged_dir: /store/user/$USER/sidm_coffea_outputs/lj_reco_cr_data_v2

channels: [lj_cr_Z_to_mumugamma_alone, lj_cr_JPsi_to_mumu_alone]
hist_collections: [lj_reco_control_samples_v3]
corrections: none
hist_mode: weighted
allow_data: true

job_lists:
  - job_args: job_args_lj_reco_cr_data_v2.txt
    samples_file: samples_data_doublemuon_2018.txt
    dataset: skimmed_llpNanoAOD_v2_skimsnano_v2
    location_cfg: data_skimmed.yaml
    files_per_job: 50
